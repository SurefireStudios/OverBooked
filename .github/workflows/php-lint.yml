name: PHP Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Syntax-check every PHP file
        run: |
          status=0
          count=0
          while IFS= read -r file; do
            count=$((count + 1))
            if ! output=$(php -l "$file" 2>&1); then
              status=1
              echo "::error file=${file}::${output//$'\n'/ }"
              printf '%s\n' "$output"
            fi
          done < <(git ls-files '*.php' | sort)
          echo "Checked $count PHP file(s) on PHP ${{ matrix.php }}."
          exit $status
